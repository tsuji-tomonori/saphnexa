version: '3'

tasks:
  precommit:
    desc: Install pre-commit hook
    cmds:
      - pre-commit install
  verify:
    desc: Run local Saphnexa verification checks
    cmds:
      - npm run verify
      - git diff --check
  contract:
    desc: Verify API and Tools API contract metadata
    cmds:
      - npm run test:contract
  integration:local:
    desc: Run local integration checks for the first vertical slice
    cmds:
      - npm run test:integration:local
  scan:bundle-domains:
    desc: Ensure web source does not embed AWS service domains
    cmds:
      - npm run scan:bundle-domains
  ci:check:
    desc: Verify GitHub Actions workflow shape locally
    cmds:
      - npm run ci:check
  docs:check:
    desc: Verify acceptance and operations documents locally
    cmds:
      - npm run docs:check
  evidence:check:
    desc: Verify acceptance evidence manifest example locally
    cmds:
      - npm run evidence:check
  security:scan:
    desc: Run local secret and security baseline checks
    cmds:
      - npm run security:scan
  coverage:check:
    desc: Verify Node test coverage thresholds
    cmds:
      - npm run coverage:check
  ui:check:
    desc: Verify local UI architecture and static accessibility gates
    cmds:
      - npm run ui:check
  web:perf:local:
    desc: Verify local web bundle and route transition smoke gates
    cmds:
      - npm run web:perf:local
  perf:api:local:
    desc: Verify local non-AI API latency and error-rate gates
    cmds:
      - npm run perf:api:local
  failure:check:
    desc: Verify local async failure injection recovery cases
    cmds:
      - npm run failure:check
  rag:quality:check:
    desc: Verify local RAG quality golden metrics and report generation
    cmds:
      - npm run rag:quality:check
  rag:security:check:
    desc: Verify local prompt injection attack catalog
    cmds:
      - npm run rag:security:check
  rag:perf:local:
    desc: Verify local RAG first notification and final answer timing gates
    cmds:
      - npm run rag:perf:local
  pairwise:check:
    desc: Verify pairwise acceptance test catalog
    cmds:
      - npm run pairwise:check
  perf:local:
    desc: Run local performance smoke checks
    cmds:
      - npm run perf:local
  cost:check:
    desc: Verify local cost estimate guardrail
    cmds:
      - npm run cost:check
  storage:check:
    desc: Verify local storage prefix and metadata invariants
    cmds:
      - npm run storage:check
  admin-artifacts:build:
    desc: Build local admin docs and test report artifacts
    cmds:
      - npm run admin-artifacts:build
  artifacts:check:
    desc: Verify local admin artifact manifests and access policy
    cmds:
      - npm run artifacts:check
