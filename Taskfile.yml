version: '3'

tasks:
  precommit:
    desc: Install pre-commit hook
    cmds:
      - pre-commit install
  verify:
    desc: Run local Saphnexa verification checks
    cmds:
      - npm run verify
      - git diff --check
  contract:
    desc: Verify API and Tools API contract metadata
    cmds:
      - npm run test:contract
  contract-mirror:generate:
    desc: Generate API and Tools contract JavaScript runtime mirrors from TypeScript source
    cmds:
      - npm run contract-mirror:generate
  contract-mirror:check:
    desc: Verify generated API and Tools contract JavaScript runtime mirrors are current
    cmds:
      - npm run contract-mirror:check
  api:openapi:check:
    desc: Verify Hono/Zod/OpenAPI route implementation metadata
    cmds:
      - npm run api:openapi:check
  integration:local:
    desc: Run local integration checks for the first vertical slice
    cmds:
      - npm run test:integration:local
  scan:bundle-domains:
    desc: Ensure web source does not embed AWS service domains
    cmds:
      - npm run scan:bundle-domains
  ci:check:
    desc: Verify GitHub Actions workflow shape locally
    cmds:
      - npm run ci:check
  cdk:constructs:check:
    desc: Verify real CDK Construct source and CloudFormation resource type inventory
    cmds:
      - npm run cdk:constructs:check
  cfn:inventory:build:
    desc: Build draft CloudFormation inventory evidence locally
    cmds:
      - npm run cfn:inventory:build
  cfn:inventory:check:
    desc: Verify draft CloudFormation inventory evidence locally
    cmds:
      - npm run cfn:inventory:check
  edge:identity:realtime:check:
    desc: Verify CloudFront, Cognito, and AppSync Events binding source locally
    cmds:
      - npm run edge:identity:realtime:check
  edge:security:check:
    desc: Verify local edge, realtime, IAM, KMS, and queue security intent
    cmds:
      - npm run edge:security:check
  docs:check:
    desc: Verify acceptance and operations documents locally
    cmds:
      - npm run docs:check
  evidence:check:
    desc: Verify acceptance evidence manifest example locally
    cmds:
      - npm run evidence:check
  acceptance:source:check:
    desc: Verify acceptance source catalog against traceability locally
    cmds:
      - npm run acceptance:source:check
  acceptance:package:build:
    desc: Build draft acceptance package artifacts locally
    cmds:
      - npm run acceptance:package:build
  acceptance:package:check:
    desc: Verify draft acceptance package artifacts locally
    cmds:
      - npm run acceptance:package:check
  acceptance:final:build:
    desc: Build final acceptance readiness preflight locally
    cmds:
      - npm run acceptance:final:build
  acceptance:final:check:
    desc: Verify final acceptance readiness preflight locally
    cmds:
      - npm run acceptance:final:check
  acceptance:final-candidate:check:
    desc: Verify final evidence candidate status locally
    cmds:
      - npm run acceptance:final-candidate:check
  acceptance:final-candidate:fixture:check:
    desc: Verify final evidence candidate ready/invalid fixture branches locally
    cmds:
      - npm run acceptance:final-candidate:fixture:check
  acceptance:external-actions:build:
    desc: Build pending external acceptance action plan locally
    cmds:
      - npm run acceptance:external-actions:build
  acceptance:external-actions:check:
    desc: Verify pending external acceptance action plan locally
    cmds:
      - npm run acceptance:external-actions:check
  security:scan:
    desc: Run local secret and security baseline checks
    cmds:
      - npm run security:scan
  coverage:check:
    desc: Verify Node test coverage thresholds
    cmds:
      - npm run coverage:check
  ui:check:
    desc: Verify local UI architecture and static accessibility gates
    cmds:
      - npm run ui:check
  web:flow:check:
    desc: Verify local web chat and admin flow contracts
    cmds:
      - npm run web:flow:check
  web:a11y:check:
    desc: Verify local static web accessibility report
    cmds:
      - npm run web:a11y:check
  web:perf:local:
    desc: Verify local web bundle and route transition smoke gates
    cmds:
      - npm run web:perf:local
  web:bundle:check:
    desc: Verify local web bundle report
    cmds:
      - npm run web:bundle:check
  perf:api:local:
    desc: Verify local non-AI API latency and error-rate gates
    cmds:
      - npm run perf:api:local
  failure:check:
    desc: Verify local async failure injection recovery cases
    cmds:
      - npm run failure:check
  rag:quality:check:
    desc: Verify local RAG quality golden metrics and report generation
    cmds:
      - npm run rag:quality:check
  rag:security:check:
    desc: Verify local prompt injection attack catalog
    cmds:
      - npm run rag:security:check
  rag:aws-binding:check:
    desc: Verify Bedrock KB, S3 Vectors, AgentCore, Tools API, and ACL binding source locally
    cmds:
      - npm run rag:aws-binding:check
  rag:perf:local:
    desc: Verify local RAG first notification and final answer timing gates
    cmds:
      - npm run rag:perf:local
  rag-core:generate:
    desc: Generate RAG core JavaScript runtime mirror from TypeScript source
    cmds:
      - npm run rag-core:generate
  rag-core:check:
    desc: Verify generated RAG core JavaScript runtime mirror is current
    cmds:
      - npm run rag-core:check
  workers:generate:
    desc: Generate Workers JavaScript runtime mirrors from TypeScript source
    cmds:
      - npm run workers:generate
  workers:check:
    desc: Verify generated Workers JavaScript runtime mirrors are current
    cmds:
      - npm run workers:check
  db:migration:check:
    desc: Verify local Flyway SQL migration naming and schema coverage
    cmds:
      - npm run db:migration:check
  db:metadata:build:
    desc: Generate DB v0.17 table and column metadata source from migration SQL
    cmds:
      - npm run db:metadata:build
  db:metadata:check:
    desc: Verify generated DB v0.17 table and column metadata source is current
    cmds:
      - npm run db:metadata:check
  db-schema:tables:generate:
    desc: Generate DB tables JavaScript runtime mirror from TypeScript source
    cmds:
      - npm run db-schema:tables:generate
  db-schema:tables:check:
    desc: Verify generated DB tables JavaScript runtime mirror is current
    cmds:
      - npm run db-schema:tables:check
  domain:generate:
    desc: Generate Domain JavaScript runtime mirrors from TypeScript source
    cmds:
      - npm run domain:generate
  domain:check:
    desc: Verify generated Domain JavaScript runtime mirrors are current
    cmds:
      - npm run domain:check
  db:comments:check:
    desc: Generate and verify DB schema COMMENT SQL from metadata
    cmds:
      - npm run db:comments:check
  db:event-source:check:
    desc: Verify event-source and projection boundary metadata
    cmds:
      - npm run db:event-source:check
  db:docs:check:
    desc: Generate and verify DB generated docs
    cmds:
      - npm run db:docs:check
  db:dsql-compat:check:
    desc: Verify Aurora DSQL-compatible migration assumptions
    cmds:
      - npm run db:dsql-compat:check
  check:static:
    desc: Run repository static analysis gates
    cmds:
      - npm run check:static
  check:no-src-js:
    desc: Verify source JavaScript transition allowlist for TypeScript source-of-truth
    cmds:
      - npm run check:no-src-js
  api:implementation:check:
    desc: Verify API implementation coverage metadata against the public API contract
    cmds:
      - npm run api:implementation:check
  tools:implementation:check:
    desc: Verify Tools API implementation coverage metadata against the tool contract
    cmds:
      - npm run tools:implementation:check
  check:atomicity:
    desc: Verify API, Agent, Web, and UI atomicity boundary metadata
    cmds:
      - npm run check:atomicity
  check:implementation-coverage-source:
    desc: Verify implementation coverage TypeScript source and JavaScript runtime mirror stay synchronized
    cmds:
      - npm run check:implementation-coverage-source
  implementation-coverage:generate:
    desc: Generate implementation coverage JavaScript runtime mirrors from TypeScript source
    cmds:
      - npm run implementation-coverage:generate
  implementation-coverage:check:
    desc: Verify generated implementation coverage JavaScript runtime mirrors are current
    cmds:
      - npm run implementation-coverage:check
  model-catalog:generate:
    desc: Generate model catalog JavaScript runtime mirrors from TypeScript source
    cmds:
      - npm run model-catalog:generate
  model-catalog:check:
    desc: Verify generated model catalog JavaScript runtime mirrors are current
    cmds:
      - npm run model-catalog:check
  db:integrity:check:
    desc: Verify local DB-like domain invariants and append-only events
    cmds:
      - npm run db:integrity:check
  search:local:check:
    desc: Verify local reference graph and BM25F search fixtures
    cmds:
      - npm run search:local:check
  observability:check:
    desc: Verify local metrics, alarms, and retention catalog
    cmds:
      - npm run observability:check
  admin:workflow:check:
    desc: Verify local admin workflows, audit events, and admin event coverage
    cmds:
      - npm run admin:workflow:check
  offline-artifacts:check:
    desc: Verify local offline artifact inventory for parser, chunks, references, and BM25F
    cmds:
      - npm run offline-artifacts:check
  restore:drill:check:
    desc: Verify local restore drill report and checksum
    cmds:
      - npm run restore:drill:check
  pairwise:check:
    desc: Verify pairwise acceptance test catalog
    cmds:
      - npm run pairwise:check
  perf:local:
    desc: Run local performance smoke checks
    cmds:
      - npm run perf:local
  cost:check:
    desc: Verify local cost estimate guardrail
    cmds:
      - npm run cost:check
  storage:check:
    desc: Verify local storage prefix and metadata invariants
    cmds:
      - npm run storage:check
  aws:dev-uat:preflight:
    desc: Verify AWS dev/UAT evidence contract before E2E, performance, and RAG quality runs
    cmds:
      - npm run aws:dev-uat:preflight
  aws:dev-uat:preflight:build:
    desc: Build final AWS dev/UAT preflight evidence from raw captured input
    cmds:
      - npm run aws:dev-uat:preflight:build
  aws:dev-uat:preflight:final:
    desc: Verify final AWS-captured dev/UAT evidence contract before real validation runs
    cmds:
      - npm run aws:dev-uat:preflight:final
  aws:dev-uat:execution-bridge:check:
    desc: Build and verify the AWS dev/UAT final evidence execution bridge
    cmds:
      - npm run aws:dev-uat:execution-bridge:check
  aws:dev-uat:execution-bridge:probe:
    desc: Probe local AWS credentials and final evidence readiness without changing AWS state
    cmds:
      - npm run aws:dev-uat:execution-bridge:probe
  aws:dev-uat:raw-capture-plan:build:
    desc: Build the AWS dev/UAT raw capture command and output reference plan
    cmds:
      - npm run aws:dev-uat:raw-capture-plan:build
  aws:dev-uat:raw-capture-plan:check:
    desc: Build and verify the AWS dev/UAT raw capture plan without changing AWS state
    cmds:
      - npm run aws:dev-uat:raw-capture-plan:check
  aws:dev-uat:raw-input-scaffold:build:
    desc: Build AWS dev/UAT raw input scaffolds from the raw capture plan
    cmds:
      - npm run aws:dev-uat:raw-input-scaffold:build
  aws:dev-uat:raw-input-scaffold:check:
    desc: Build and verify AWS dev/UAT raw input scaffolds without changing AWS state
    cmds:
      - npm run aws:dev-uat:raw-input-scaffold:check
  aws:dev-uat:operator-input:build:
    desc: Build the AWS dev/UAT operator input scaffold
    cmds:
      - npm run aws:dev-uat:operator-input:build
  aws:dev-uat:operator-input:check:
    desc: Build and verify the AWS dev/UAT operator input scaffold without changing AWS state
    cmds:
      - npm run aws:dev-uat:operator-input:check
  aws:dev-uat:operator-input:fixture:check:
    desc: Verify AWS dev/UAT resolved operator input fixture branches
    cmds:
      - npm run aws:dev-uat:operator-input:fixture:check
  aws:dev-uat:operator-runbook:build:
    desc: Build the AWS dev/UAT operator execution runbook
    cmds:
      - npm run aws:dev-uat:operator-runbook:build
  aws:dev-uat:operator-runbook:check:
    desc: Build and verify the AWS dev/UAT operator execution runbook
    cmds:
      - npm run aws:dev-uat:operator-runbook:check
  aws:dev-uat:operator-runbook:fixture:check:
    desc: Verify AWS dev/UAT operator execution runbook ready and blocked branches
    cmds:
      - npm run aws:dev-uat:operator-runbook:fixture:check
  aws:dev-uat:raw-output:fixture:check:
    desc: Verify AWS dev/UAT raw output files for sample captured inputs
    cmds:
      - npm run aws:dev-uat:raw-output:fixture:check
  aws:dev-uat:raw-input:fixture:check:
    desc: Dry-run AWS dev/UAT raw input samples and reject unfinished scaffolds
    cmds:
      - npm run aws:dev-uat:raw-input:fixture:check
  aws:dev-uat:capture-helpers:check:
    desc: Verify AWS dev/UAT raw capture helper entrypoints and missing-env failures
    cmds:
      - npm run aws:dev-uat:capture-helpers:check
  aws:dev-uat:preflight-raw-input:fixture:check:
    desc: Verify AWS dev/UAT preflight raw input materializer
    cmds:
      - npm run aws:dev-uat:preflight-raw-input:fixture:check
  aws:dev-uat:validation-capture:fixture:check:
    desc: Verify AWS dev/UAT validation result capture helpers and threshold failures
    cmds:
      - npm run aws:dev-uat:validation-capture:fixture:check
  aws:dev-uat:validation-raw-input:fixture:check:
    desc: Verify AWS dev/UAT validation raw input materializer
    cmds:
      - npm run aws:dev-uat:validation-raw-input:fixture:check
  aws:dev-uat:materialized-flow:fixture:check:
    desc: Verify AWS dev/UAT materialized raw input to evidence bundle flow
    cmds:
      - npm run aws:dev-uat:materialized-flow:fixture:check
  aws:dev-uat:final-readiness:check:
    desc: Build and verify AWS dev/UAT final readiness manifest without changing AWS state
    cmds:
      - npm run aws:dev-uat:final-readiness:check
  aws:dev-uat:final-readiness:fixture:check:
    desc: Verify AWS dev/UAT final readiness manifest fixture branches
    cmds:
      - npm run aws:dev-uat:final-readiness:fixture:check
  aws:dev-uat:operator-handoff:check:
    desc: Build and verify the AWS dev/UAT operator handoff artifact
    cmds:
      - npm run aws:dev-uat:operator-handoff:check
  aws:dev-uat:operator-handoff:fixture:check:
    desc: Verify AWS dev/UAT operator handoff fixture branches
    cmds:
      - npm run aws:dev-uat:operator-handoff:fixture:check
  aws:dev-uat:evidence-bundle:fixture:check:
    desc: Verify AWS dev/UAT evidence bundle manifest fixture
    cmds:
      - npm run aws:dev-uat:evidence-bundle:fixture:check
  aws:dev-uat:validation:check:
    desc: Verify AWS dev/UAT E2E, performance, and RAG quality validation evidence fixture
    cmds:
      - npm run aws:dev-uat:validation:check
  aws:dev-uat:validation:build:
    desc: Build final AWS dev/UAT validation evidence from raw captured input
    cmds:
      - npm run aws:dev-uat:validation:build
  aws:dev-uat:validation:fixture:check:
    desc: Verify AWS dev/UAT validation fixture positive and negative branches
    cmds:
      - npm run aws:dev-uat:validation:fixture:check
  aws:dev-uat:evidence:fixture:check:
    desc: Verify AWS dev/UAT evidence builders with captured-input samples
    cmds:
      - npm run aws:dev-uat:evidence:fixture:check
  aws:dev-uat:validation:final:
    desc: Verify final AWS dev/UAT E2E, performance, and RAG quality validation evidence
    cmds:
      - npm run aws:dev-uat:validation:final
  admin-artifacts:build:
    desc: Build local admin docs and test report artifacts
    cmds:
      - npm run admin-artifacts:build
  artifacts:check:
    desc: Verify local admin artifact manifests and access policy
    cmds:
      - npm run artifacts:check
  admin-artifacts:publish:check:
    desc: Verify Docusaurus and Allure admin artifact publish bindings
    cmds:
      - npm run admin-artifacts:publish:check
